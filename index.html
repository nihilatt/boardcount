<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Boardcount</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121218;
    --bg-2:#0d0d12;
    --panel:#1b1b23;
    --panel-2:#232330;
    --line:#2c2c38;
    --ink:#f5f3ee;
    --ink-dim:#9694a3;
    --ink-faint:#5b5a68;
    --gold:#ffb800;
    --danger:#e63946;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(120% 140% at 50% -10%, #1a1a22 0%, var(--bg) 45%, var(--bg-2) 100%);
    color:var(--ink);
    font-family:var(--font-body);
    overflow-x:hidden;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--gold);color:#1a1400;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 10px;
    padding-top:calc(16px + env(safe-area-inset-top));
  }
  .logo{
    display:flex;align-items:center;gap:9px;
    font-family:var(--font-display);font-weight:700;
    font-size:19px;letter-spacing:.2px;
  }
  .logo .dice{
    width:22px;height:22px;border-radius:6px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .logo .dice span{width:5px;height:5px;border-radius:50%;background:#1a1400;display:block;}
  .logo b{color:var(--ink);}
  .logo em{font-style:normal;color:var(--ink-dim);font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;background:var(--panel);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);transition:background .15s ease, color .15s ease, transform .1s ease;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn:hover{color:var(--ink);background:var(--panel-2);}
  .room-badge{
    display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:100px;padding:7px 12px;font-family:var(--font-mono);font-size:13px;font-weight:700;
    color:var(--gold);letter-spacing:1px;transition:transform .1s ease, background .15s ease;
  }
  .room-badge:active{transform:scale(.95);background:var(--panel-2);}
  .room-badge .lbl{font-family:var(--font-body);font-weight:600;color:var(--ink-faint);font-size:10.5px;letter-spacing:.3px;text-transform:none;}

  /* ---------- Header player row ---------- */
  .header-row{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));
    gap:8px;padding:0 14px 14px;max-width:640px;margin:0 auto;width:100%;
  }
  .player-square{
    background:var(--panel);border-radius:var(--radius-md);
    border-top:4px solid var(--pc,var(--gold));
    padding:9px 8px 8px;position:relative;overflow:hidden;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .player-square.me{box-shadow:0 0 0 2px var(--gold) inset;}
  .player-square .prow{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
  .player-square .dot{width:6px;height:6px;border-radius:50%;background:var(--pc,var(--gold));flex-shrink:0;}
  .player-square .name{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;
  }
  .player-square .score{
    font-family:var(--font-mono);font-weight:700;color:var(--ink);
    font-size:clamp(17px,4.4vw,23px);line-height:1;font-variant-numeric:tabular-nums;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .player-square .score.bump{transform:scale(1.18);}
  .player-square .youtag{
    position:absolute;top:6px;right:7px;font-size:8px;font-weight:700;letter-spacing:.5px;
    color:var(--gold);
  }

  /* ---------- Stage (main play area) ---------- */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 16px 4px;}
  .my-score-wrap{text-align:center;padding:10px 0 2px;width:100%;max-width:420px;}
  .my-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:2px;}
  .my-score{
    font-family:var(--font-mono);font-weight:700;color:var(--pc,var(--gold));
    font-size:clamp(58px,19vw,96px);line-height:1;font-variant-numeric:tabular-nums;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1);cursor:pointer;
  }
  .my-score.bump{transform:scale(1.14);}
  .edit-hint{font-size:10.5px;color:var(--ink-faint);margin-top:2px;visibility:hidden;}
  .my-score-wrap:hover .edit-hint{visibility:visible;}

  .pending-wrap{min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;max-width:340px;}
  .pending-value{
    font-family:var(--font-mono);font-weight:700;color:var(--ink);
    font-size:clamp(24px,7vw,34px);line-height:1;font-variant-numeric:tabular-nums;
    min-height:34px;opacity:0;transition:opacity .12s ease;
  }
  .pending-value.show{opacity:1;}
  .fuse-track{width:100%;max-width:220px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px;opacity:0;transition:opacity .12s ease;}
  .fuse-track.show{opacity:1;}
  .fuse-fill{height:100%;width:100%;background:var(--pc,var(--gold));border-radius:3px;transform-origin:left;}
  .fuse-fill.run{animation:fuseCountdown linear forwards;}
  @keyframes fuseCountdown{from{transform:scaleX(1);}to{transform:scaleX(0);}}

  /* ---------- Keypad ---------- */
  .keypad{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    width:100%;max-width:340px;margin:6px auto 18px;padding:0 2px;
  }
  .key{
    aspect-ratio:1;border-radius:var(--radius-md);background:var(--panel);
    border:1px solid var(--line);color:var(--ink);
    font-family:var(--font-mono);font-weight:600;font-size:clamp(22px,7vw,28px);
    display:flex;align-items:center;justify-content:center;
    transition:transform .07s ease, background .12s ease;
  }
  .key:active{transform:scale(.92);background:var(--panel-2);}
  .key.func{color:var(--ink-dim);font-family:var(--font-body);font-weight:700;font-size:15px;}
  .key.sign{color:var(--gold);}

  /* ---------- Lobby / room-select ---------- */
  .lobby-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 18px 40px;}
  .lobby-card{width:100%;max-width:400px;}
  .lobby-title{font-family:var(--font-display);font-size:15px;color:var(--ink-dim);text-align:center;margin:2px 0 22px;font-weight:500;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);font-weight:700;margin:0 0 8px 2px;}
  .nick-input{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;color:var(--ink);font-size:17px;font-family:var(--font-body);font-weight:500;
    outline:none;transition:border-color .15s ease;margin-bottom:20px;
  }
  .nick-input:focus{border-color:var(--gold);}
  .nick-input.code-input{font-family:var(--font-mono);letter-spacing:4px;text-transform:uppercase;text-align:center;font-weight:700;font-size:20px;}
  .color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:22px;}
  .color-swatch{
    aspect-ratio:1;border-radius:50%;border:2px solid transparent;position:relative;
    display:flex;align-items:center;justify-content:center;transition:transform .12s ease;
  }
  .color-swatch:active{transform:scale(.9);}
  .color-swatch.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink);}
  .color-swatch.taken{opacity:.22;pointer-events:none;}
  .color-swatch .check{color:#000;font-size:16px;font-weight:900;opacity:0;}
  .color-swatch.selected .check{opacity:1;}
  .join-btn{
    width:100%;padding:15px;border:none;border-radius:var(--radius-md);
    background:var(--gold);color:#1a1400;font-family:var(--font-display);font-weight:700;
    font-size:16px;letter-spacing:.3px;transition:transform .1s ease, opacity .15s ease;
  }
  .join-btn:active{transform:scale(.98);}
  .join-btn:disabled{opacity:.4;pointer-events:none;}
  .lobby-note{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:14px;line-height:1.5;}
  .lobby-players{margin-top:26px;}
  .lp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border-radius:var(--radius-sm);margin-bottom:6px;}
  .lp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .lp-name{font-size:14px;font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lp-score{font-family:var(--font-mono);font-size:13px;color:var(--ink-dim);}
  .full-msg{text-align:center;color:var(--danger);font-size:13px;font-weight:600;margin-top:10px;}
  .or-sep{display:flex;align-items:center;gap:12px;margin:26px 0;color:var(--ink-faint);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;}
  .or-sep::before,.or-sep::after{content:'';flex:1;height:1px;background:var(--line);}
  .back-link{display:block;text-align:center;color:var(--ink-faint);font-size:13px;margin-top:18px;font-weight:600;}
  .back-link:active{color:var(--ink);}

  /* ---------- Modal (options) ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,8,11,.72);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  @media (min-width:560px){.overlay{align-items:center;}}
  .modal{
    width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(16px);transition:transform .18s ease;max-height:86vh;overflow-y:auto;
  }
  @media (min-width:560px){.modal{border-radius:var(--radius-lg);}}
  .overlay.open .modal{transform:translateY(0);}
  .modal h3{font-family:var(--font-display);font-size:17px;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between;}
  .modal h3 .x{width:30px;height:30px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:14px;}
  .opt-block{margin-bottom:22px;}
  .opt-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-faint);font-weight:700;margin-bottom:10px;}
  .delay-row{display:flex;align-items:center;gap:12px;}
  .delay-row input[type=range]{flex:1;accent-color:var(--gold);}
  .delay-val{font-family:var(--font-mono);font-weight:700;color:var(--gold);min-width:44px;text-align:right;}
  .opt-btn{
    width:100%;padding:13px;border-radius:var(--radius-md);border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);font-weight:600;font-size:14.5px;margin-bottom:9px;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s ease, transform .1s ease;
  }
  .opt-btn:active{transform:scale(.98);}
  .opt-btn.danger{color:var(--danger);border-color:rgba(230,57,70,.35);}
  .opt-players{margin-top:6px;}
  .opt-player-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
  .opt-player-row:last-child{border-bottom:none;}
  .opt-player-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .opt-player-row .nm{flex:1;font-size:13.5px;font-weight:600;}
  .opt-player-row .sc{font-family:var(--font-mono);font-size:13px;color:var(--ink-dim);}

  .toast{
    position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:10px 18px;
    border-radius:100px;font-size:13px;font-weight:600;opacity:0;transition:all .25s ease;pointer-events:none;z-index:60;
    max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Setup-needed screen ---------- */
  .setup-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 20px;}
  .setup-card{max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;}
  .setup-card h2{font-family:var(--font-display);font-size:19px;margin:0 0 12px;}
  .setup-card p{color:var(--ink-dim);font-size:14px;line-height:1.6;margin:0 0 10px;}
  .setup-card code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-family:var(--font-mono);font-size:13px;color:var(--gold);}

  /* ---------- Arcade / comic overtake taunt popup ---------- */
  .taunt-overlay{
    position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
    pointer-events:none;padding:20px;perspective:1000px;overflow:hidden;
  }
  body.taunt-shake{animation:screen-shake .34s cubic-bezier(.36,.07,.19,.97) both;}
  .taunt-card{
    position:relative;max-width:94vw;min-width:min(280px,88vw);
    padding:25px 30px 29px;border-radius:18px;
    background:radial-gradient(circle at 50% 45%,rgba(255,184,0,.18),transparent 58%),rgba(8,8,13,.72);
    border:3px solid #ffb800;
    box-shadow:0 0 0 3px #09090d,0 0 0 6px rgba(255,184,0,.7),0 18px 45px rgba(0,0,0,.65),0 0 55px rgba(255,184,0,.38);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transform:rotate(var(--rot,-5deg)) scale(.15);opacity:0;
    will-change:transform,opacity,filter;
    animation:var(--taunt-animation) var(--taunt-duration,4.5s) cubic-bezier(.18,1.35,.28,1) forwards;
  }
  .taunt-card::before{
    content:'';position:absolute;inset:-115px;z-index:-3;
    background:repeating-conic-gradient(from 0deg,rgba(255,184,0,0) 0deg 7deg,rgba(255,184,0,.24) 7deg 10deg,rgba(255,184,0,0) 10deg 18deg);
    -webkit-mask-image:radial-gradient(circle,black 0 31%,transparent 70%);
    mask-image:radial-gradient(circle,black 0 31%,transparent 70%);
    animation:comic-burst 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  .taunt-card::after{
    content:'';position:absolute;inset:-10px;border-radius:22px;z-index:-1;
    border:4px solid rgba(255,184,0,.8);box-shadow:0 0 30px rgba(255,184,0,.45);
    animation:shock-ring 1s ease-out both;
  }
  .taunt-text{
    position:relative;font-family:'Bangers',Impact,'Arial Black',sans-serif;font-weight:400;
    font-size:clamp(34px,9vw,60px);line-height:.98;text-align:center;color:#ffb800;
    letter-spacing:1.4px;-webkit-text-stroke:2.5px #08080c;paint-order:stroke fill;
    text-shadow:4px 4px 0 #08080c,-2px -2px 0 #08080c,3px -2px 0 #08080c,-2px 3px 0 #08080c,0 10px 22px rgba(0,0,0,.8);
    will-change:transform,filter,opacity;
  }
  .taunt-v1{--taunt-animation:taunt-impact}.taunt-v1 .taunt-text{animation:text-impact .7s cubic-bezier(.15,1.8,.3,1) both}
  .taunt-v2{--taunt-animation:taunt-zoom}.taunt-v2 .taunt-text{animation:text-zoom .85s cubic-bezier(.15,1.6,.25,1) both}
  .taunt-v3{--taunt-animation:taunt-slide}.taunt-v3 .taunt-text{animation:text-slide .9s cubic-bezier(.12,1.5,.3,1) both}
  .taunt-v4{--taunt-animation:taunt-glitch}.taunt-v4 .taunt-text{animation:text-glitch .85s cubic-bezier(.2,1.4,.3,1) both}
  .taunt-v5{--taunt-animation:taunt-spin}.taunt-v5 .taunt-text{animation:text-spin .95s cubic-bezier(.12,1.55,.25,1) both}

  @keyframes taunt-impact{
    0%{opacity:0;transform:rotate(calc(var(--rot)*1.7)) scale(3.2);filter:blur(20px)}
    12%{opacity:1;transform:rotate(calc(var(--rot)*.65)) scale(.78);filter:blur(0)}
    20%{transform:rotate(calc(var(--rot)*.45)) scale(1.18)} 27%{transform:rotate(calc(var(--rot)*.5)) scale(.96)}
    34%{transform:rotate(calc(var(--rot)*.5)) scale(1)} 76%{opacity:1}
    100%{opacity:0;transform:rotate(calc(var(--rot)*.2)) scale(.78);filter:blur(9px)}
  }
  @keyframes taunt-zoom{
    0%{opacity:0;transform:scale(.05);filter:blur(30px)} 16%{opacity:1;transform:scale(1.3);filter:blur(0)}
    25%{transform:scale(.92)} 35%{transform:scale(1.04)} 76%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.4);filter:blur(13px)}
  }
  @keyframes taunt-slide{
    0%{opacity:0;transform:translateX(75vw) rotate(20deg) scale(.5);filter:blur(15px)}
    18%{opacity:1;transform:translateX(-10px) rotate(-5deg) scale(1.05);filter:blur(0)}
    27%{transform:translateX(5px) rotate(3deg) scale(1)} 76%{opacity:1}
    100%{opacity:0;transform:translateX(-35vw) rotate(-8deg) scale(.82);filter:blur(10px)}
  }
  @keyframes taunt-glitch{
    0%{opacity:0;transform:scale(.55) skewX(22deg);filter:blur(12px)}
    12%{opacity:1;transform:scale(1.12) skewX(-8deg);filter:blur(0)}
    17%{transform:translateX(-8px) skewX(5deg)} 22%{transform:translateX(9px) skewX(-4deg)}
    28%{transform:translateX(-3px) skewX(1deg)} 35%{transform:translateX(0) skewX(0)} 76%{opacity:1}
    100%{opacity:0;transform:scale(.88);filter:blur(10px)}
  }
  @keyframes taunt-spin{
    0%{opacity:0;transform:rotate(calc(var(--rot) + 45deg)) scale(.15) translateY(-35vh);filter:blur(18px)}
    18%{opacity:1;transform:rotate(calc(var(--rot) - 5deg)) scale(1.12) translateY(0);filter:blur(0)}
    29%{transform:rotate(calc(var(--rot) + 3deg)) scale(.96)} 38%{transform:rotate(calc(var(--rot)*.5)) scale(1)} 76%{opacity:1}
    100%{opacity:0;transform:rotate(calc(var(--rot)*.2)) scale(.82);filter:blur(11px)}
  }
  @keyframes text-impact{0%{transform:scale(.25);filter:blur(14px)}55%{transform:scale(1.18);filter:blur(0)}72%{transform:scale(.96)}100%{transform:scale(1)}}
  @keyframes text-zoom{0%{transform:scale(2.5);filter:blur(13px)}60%{transform:scale(.93);filter:blur(0)}100%{transform:scale(1)}}
  @keyframes text-slide{0%{transform:translateX(-90px) rotate(-7deg);filter:blur(9px)}65%{transform:translateX(8px) rotate(2deg);filter:blur(0)}100%{transform:translateX(0) rotate(0)}}
  @keyframes text-glitch{0%{transform:scale(.7);filter:blur(7px)}25%{transform:translateX(-8px) skewX(-6deg)}32%{transform:translateX(9px) skewX(5deg)}40%{transform:translateX(-4px) skewX(-2deg)}52%{transform:translateX(2px) skewX(1deg)}100%{transform:translateX(0) skewX(0)}}
  @keyframes text-spin{0%{transform:rotate(-18deg) scale(.35);filter:blur(11px)}60%{transform:rotate(3deg) scale(1.12);filter:blur(0)}100%{transform:rotate(0) scale(1)}}
  @keyframes comic-burst{0%{transform:scale(.1) rotate(-20deg);opacity:0}25%{transform:scale(1.1) rotate(20deg);opacity:1}100%{transform:scale(1.25) rotate(65deg);opacity:.45}}
  @keyframes shock-ring{0%{transform:scale(.3);opacity:0}18%{opacity:1}100%{transform:scale(1.35);opacity:0}}
  @keyframes screen-shake{
    0%,100%{transform:translate(0,0) rotate(0)}15%{transform:translate(-5px,3px) rotate(-.3deg)}
    30%{transform:translate(5px,-3px) rotate(.3deg)}45%{transform:translate(-4px,-2px) rotate(-.2deg)}
    60%{transform:translate(3px,2px) rotate(.2deg)}75%{transform:translate(-1px,0)}
  }
  @media (prefers-reduced-motion:reduce){
    .taunt-card,.taunt-text,.taunt-card::before,.taunt-card::after,body.taunt-shake{animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";

  /* =========================================================
     CONFIGURATION
     Paste your Firebase Realtime Database URL below. It looks
     like: https://your-project-default-rtdb.europe-west1.firebasedatabase.app
     (see Firebase console → Build → Realtime Database)
     ========================================================= */
  const FIREBASE_URL = "https://boardcount-default-rtdb.europe-west1.firebasedatabase.app";

  /* ================= Local (per-device) storage ================= */
  function lsGet(key){
    try{ const v = localStorage.getItem(key); return v===null ? null : JSON.parse(v); }
    catch(e){ return null; }
  }
  function lsSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
  function lsDel(key){ try{ localStorage.removeItem(key); }catch(e){} }

  /* ================= Remote (shared) storage — Firebase REST ================= */
  function fbPath(key){ return key.split(':').join('/'); }
  async function dbGet(key){
    try{
      const res = await fetch(FIREBASE_URL + '/' + fbPath(key) + '.json');
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }
  async function dbSet(key, value){
    try{
      const res = await fetch(FIREBASE_URL + '/' + fbPath(key) + '.json', {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(value)
      });
      return res.ok;
    }catch(e){ console.error('db set failed', key, e); return false; }
  }
  async function dbDel(key){
    try{ await fetch(FIREBASE_URL + '/' + fbPath(key) + '.json', {method:'DELETE'}); }catch(e){}
  }

  /* ================= Constants ================= */
  const kIds = room => 'rooms:' + room + ':playerIds';
  const kPlayer = (room,id) => 'rooms:' + room + ':player:' + id;
  const kSettings = room => 'rooms:' + room + ':settings';
  const MAX_PLAYERS = 6;
  const POLL_MS = 1400;
  const ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid confusion

  const COLORS = [
    {id:'crimson',   hex:'#E63946', name:'Crimson'},
    {id:'tangerine', hex:'#F77F00', name:'Tangerine'},
    {id:'meadow',    hex:'#2DAF7D', name:'Meadow'},
    {id:'sky',       hex:'#3A86FF', name:'Sky'},
    {id:'violet',    hex:'#9B5DE5', name:'Violet'},
    {id:'rose',      hex:'#FF6FA5', name:'Rose'},
  ];
  function colorHex(id){ const c = COLORS.find(c=>c.id===id); return c ? c.hex : '#FFB800'; }
  function makeRoomCode(){
    let s = '';
    for(let i=0;i<4;i++) s += ROOM_CHARS[Math.floor(Math.random()*ROOM_CHARS.length)];
    return s;
  }

  const TAUNTS = [
    'Seber si drobné a jdi domů. 💸',
    'Tohle bylo trapné i pro tebe. 😬',
    'Možná zkus jinou hru. 🎯',
    'Zrovna jsi mi otevřel(a) dveře. Díky! 🚪',
    'Sorry, ale tohle byl masakr. 🔪',
    'Koukej se učit z mistra. 👑',
    'Tenhle kolaps si nikdo nezasloužil víc než ty. 💥',
    'Padáš rychleji než akcie. 📉',
    'Gratuluju k místu v mém stínu. 🕶️',
    'Tohle tempo tě nikam nedostane. 🐌',
    'Škoda že body nejdou vrátit. 🗑️',
    'Tvoje jméno teď znamená "poražený". 😤',
    'Táhni domů! 🚪',
    'Sedíš si na prstech nebo na mozku? 🤔',
    'Měl jsi si dát radši pivo. 🍺',
    'Zalez pod stůl! 🫣',
  ];
  let prevAheadSet = null;
  let toastQueue = [];
  let toastShowing = false;

  /* ================= State ================= */
  const S = {
    screen: 'loading',
    room: null,
    players: [],
    ids: [],
    settings: {delayMs:2000},
    myId: null,
    pending: '',
    sign: '+',
    selectedColor: null,
    editingScore: false,
  };

  let timerHandle = null;
  let writingScore = false;
  let pollHandle = null;
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2400);
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ================= Overtake taunts — shown to the player who got overtaken ================= */
  let seenTauntIds = new Set();

  function checkOvertakes(){
    const me = myPlayer();
    if(!me || S.players.length < 2){ prevAheadSet = null; return; }
    const currentlyAhead = new Set();
    for(const p of S.players){
      if(p.id === me.id) continue;
      if(me.score > p.score) currentlyAhead.add(p.id);
    }
    if(prevAheadSet === null){
      prevAheadSet = currentlyAhead;
      return;
    }
    const newlyOvertaken = [...currentlyAhead].filter(id => !prevAheadSet.has(id));
    prevAheadSet = currentlyAhead;
    for(const victimId of newlyOvertaken){
      sendTauntEvent(victimId);
    }
  }

  async function sendTauntEvent(victimId){
    if(!S.room) return;
    const eventId = 't_' + Math.random().toString(36).slice(2,10);
    const key = 'rooms:' + S.room + ':taunts:' + eventId;
    await dbSet(key, {targetId: victimId, ts: Date.now()});
    setTimeout(()=>dbDel(key), 12000); // best-effort cleanup
  }

  async function checkForIncomingTaunts(){
    if(!S.room || !S.myId) return;
    const taunts = await dbGet('rooms:' + S.room + ':taunts');
    if(!taunts) return;
    const now = Date.now();
    for(const [eventId, ev] of Object.entries(taunts)){
      if(!ev) continue;
      if(!seenTauntIds.has(eventId)){
        seenTauntIds.add(eventId);
        if(ev.targetId === S.myId) showTaunt();
      }
      if(now - (ev.ts || 0) > 15000){
        dbDel('rooms:' + S.room + ':taunts:' + eventId);
      }
    }
  }

  function showTaunt(){
    toastQueue.push(true);
    if(!toastShowing) drainTauntQueue();
  }

  const TAUNT_EFFECTS = ['taunt-v1','taunt-v2','taunt-v3','taunt-v4','taunt-v5'];

  function drainTauntQueue(){
    if(!toastQueue.length){ toastShowing = false; return; }
    toastShowing = true;
    toastQueue.shift();
    const text = TAUNTS[Math.floor(Math.random()*TAUNTS.length)];
    const dir = Math.random() > 0.5 ? 1 : -1;
    const rot = dir * (4 + Math.random()*5);
    const effect = TAUNT_EFFECTS[Math.floor(Math.random()*TAUNT_EFFECTS.length)];

    document.body.classList.remove('taunt-shake');
    void document.body.offsetWidth;
    document.body.classList.add('taunt-shake');
    setTimeout(()=>document.body.classList.remove('taunt-shake'), 380);

    const overlay = document.createElement('div');
    overlay.className = 'taunt-overlay';
    overlay.innerHTML = `<div class="taunt-card ${effect}" style="--rot:${rot}deg"><div class="taunt-text">${escapeHtml(text)}</div></div>`;
    document.body.appendChild(overlay);
    setTimeout(()=>{ overlay.remove(); drainTauntQueue(); }, 4500);
  }

  /* ================= Data sync ================= */
  async function refreshAll(){
    if(!S.room) return;
    const ids = (await dbGet(kIds(S.room))) || [];
    const players = [];
    for(const id of ids){
      const p = await dbGet(kPlayer(S.room, id));
      if(p) players.push(p);
    }
    if(writingScore && S.myId){
      const localMe = S.players.find(p=>p.id===S.myId);
      const idx = players.findIndex(p=>p.id===S.myId);
      if(localMe && idx>=0) players[idx] = {...players[idx], score: localMe.score};
    }
    S.ids = ids.filter(id => players.some(p=>p.id===id));
    S.players = players;
    const settings = await dbGet(kSettings(S.room));
    if(settings && typeof settings.delayMs === 'number') S.settings = settings;
  }

  function startPolling(){
    stopPolling();
    pollHandle = setInterval(async ()=>{
      if(document.hidden || !S.room) return;
      await refreshAll();
      if(S.screen === 'lobby') updateLobbyDynamic();
      if(S.screen === 'game'){
        updateGameDynamic();
        checkForIncomingTaunts();
      }
    }, POLL_MS);
  }
  function stopPolling(){ if(pollHandle){ clearInterval(pollHandle); pollHandle = null; } }

  /* ================= Init ================= */
  async function init(){
    renderLoading();

    if(!FIREBASE_URL || FIREBASE_URL.indexOf('PASTE_YOUR') >= 0){
      renderSetupNeeded();
      return;
    }

    const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase().trim();
    const savedRoom = lsGet('bc_room');
    const savedId = lsGet('bc_myId');

    if(savedRoom && savedId && (!urlRoom || urlRoom === savedRoom)){
      S.room = savedRoom;
      S.myId = savedId;
      await refreshAll();
      if(S.players.some(p=>p.id===S.myId)){
        S.screen = 'game';
        renderGame();
        startPolling();
        return;
      }
    }

    S.screen = 'roomSelect';
    renderRoomSelect(urlRoom);
  }

  function renderLoading(){
    app.innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-family:var(--font-display);letter-spacing:1px;">Načítám…</div>';
  }

  function renderSetupNeeded(){
    app.innerHTML = `
      <div class="setup-wrap">
        <div class="setup-card">
          <h2>⚙ Appka ještě není propojená s databází</h2>
          <p>Aby se hráči mohli propojit mezi zařízeními, potřebuje appka adresu Firebase Realtime Database.</p>
          <p>V souboru najdi řádek s <code>FIREBASE_URL</code> a nahraď <code>PASTE_YOUR_FIREBASE_DATABASE_URL_HERE</code> svou adresou databáze (tvar <code>https://tvuj-projekt-default-rtdb.region.firebasedatabase.app</code>), pak ulož a nahraj znovu.</p>
        </div>
      </div>
    `;
  }

  /* ================= ROOM SELECT ================= */
  function renderRoomSelect(prefillCode){
    app.innerHTML = `
      <div class="topbar">
        <div class="logo"><span class="dice"><span></span></span><b>BOARD</b><em>COUNT</em></div>
        <div></div>
      </div>
      <div class="lobby-wrap">
        <div class="lobby-card">
          <div class="lobby-title">Počítání bodů pro herní večer</div>

          <button class="join-btn" id="createRoomBtn">➕ Vytvořit novou hru</button>

          <div class="or-sep">nebo</div>

          <div class="field-label">Kód hry</div>
          <input class="nick-input code-input" id="roomInput" maxlength="6" placeholder="ABCD" value="${escapeHtml(prefillCode||'')}" autocomplete="off">
          <button class="join-btn" id="joinRoomBtn" style="background:var(--panel-2);color:var(--ink);border:1px solid var(--line);">Připojit se ke hře</button>

          <div class="lobby-note">Kdo zná kód hry, může se připojit ze svého telefonu. Kód hry uvidíš nahoře po vytvoření hry.</div>
        </div>
      </div>
    `;
    document.getElementById('createRoomBtn').addEventListener('click', ()=>{
      S.room = makeRoomCode();
      S.screen = 'lobby';
      renderLobby();
      startPolling();
    });
    document.getElementById('joinRoomBtn').addEventListener('click', ()=>{
      const code = (document.getElementById('roomInput').value || '').trim().toUpperCase();
      if(!code){ toast('Zadej kód hry'); return; }
      S.room = code;
      S.screen = 'lobby';
      renderLobby();
      startPolling();
    });
    document.getElementById('roomInput').addEventListener('keydown', e=>{
      if(e.key === 'Enter') document.getElementById('joinRoomBtn').click();
    });
  }

  /* ================= LOBBY (nickname + color, inside a room) ================= */
  function renderLobby(){
    S.pending = ''; S.sign = '+'; S.myId = null;
    app.innerHTML = `
      <div class="topbar">
        <div class="logo"><span class="dice"><span></span></span><b>BOARD</b><em>COUNT</em></div>
        <div class="room-badge"><span class="lbl">KÓD</span>${escapeHtml(S.room)}</div>
      </div>
      <div class="lobby-wrap">
        <div class="lobby-card">
          <div class="lobby-title">Připoj se ke hře na tomto zařízení</div>
          <div class="field-label">Přezdívka</div>
          <input class="nick-input" id="nickInput" maxlength="16" placeholder="Např. Tomáš" autocomplete="off">
          <div class="field-label">Barva</div>
          <div class="color-grid" id="colorGrid"></div>
          <button class="join-btn" id="joinBtn">Připojit se</button>
          <div class="full-msg" id="fullMsg" style="display:none;">Hra je plná (6/6 hráčů)</div>
          <div class="lobby-note">Ostatní se připojí zadáním kódu <b style="color:var(--ink)">${escapeHtml(S.room)}</b> na stejné adrese.</div>
          <div class="lobby-players" id="lobbyPlayers"></div>
          <a class="back-link" id="backLink">← Zpět na výběr hry</a>
        </div>
      </div>
    `;

    (async ()=>{
      await refreshAll();
      const takenColors = new Set(S.players.map(p=>p.color));
      const firstFree = COLORS.find(c=>!takenColors.has(c.id));
      S.selectedColor = firstFree ? firstFree.id : null;
      buildColorGrid();
      updateLobbyDynamic();
    })();

    document.getElementById('joinBtn').addEventListener('click', onJoinClick);
    document.getElementById('nickInput').addEventListener('keydown', e=>{ if(e.key==='Enter') onJoinClick(); });
    document.getElementById('backLink').addEventListener('click', ()=>{
      stopPolling();
      S.room = null;
      S.screen = 'roomSelect';
      renderRoomSelect('');
    });
  }

  function buildColorGrid(){
    const grid = document.getElementById('colorGrid');
    if(!grid) return;
    grid.innerHTML = COLORS.map(c=>`
      <button class="color-swatch" data-color="${c.id}" style="background:${c.hex}" title="${c.name}">
        <span class="check">✓</span>
      </button>
    `).join('');
    grid.querySelectorAll('.color-swatch').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.classList.contains('taken')) return;
        S.selectedColor = btn.dataset.color;
        grid.querySelectorAll('.color-swatch').forEach(b=>b.classList.toggle('selected', b===btn));
      });
    });
  }

  function updateLobbyDynamic(){
    const grid = document.getElementById('colorGrid');
    if(!grid) return;
    const taken = new Set(S.players.map(p=>p.color));
    grid.querySelectorAll('.color-swatch').forEach(btn=>{
      const cid = btn.dataset.color;
      const isTaken = taken.has(cid);
      btn.classList.toggle('taken', isTaken);
      btn.classList.toggle('selected', cid === S.selectedColor && !isTaken);
    });
    if(S.selectedColor && taken.has(S.selectedColor)){
      const free = COLORS.find(c=>!taken.has(c.id));
      S.selectedColor = free ? free.id : null;
      grid.querySelectorAll('.color-swatch').forEach(b=>b.classList.toggle('selected', b.dataset.color===S.selectedColor));
    }

    const full = S.players.length >= MAX_PLAYERS;
    const joinBtn = document.getElementById('joinBtn');
    if(joinBtn) joinBtn.disabled = full || !S.selectedColor;
    const fullMsg = document.getElementById('fullMsg');
    if(fullMsg) fullMsg.style.display = full ? 'block' : 'none';

    const list = document.getElementById('lobbyPlayers');
    if(list){
      list.innerHTML = S.players.map(p=>`
        <div class="lp-row">
          <span class="lp-dot" style="background:${colorHex(p.color)}"></span>
          <span class="lp-name">${escapeHtml(p.nickname)}</span>
          <span class="lp-score">${p.score}</span>
        </div>
      `).join('');
    }
  }

  async function onJoinClick(){
    const nickInput = document.getElementById('nickInput');
    const nickname = (nickInput.value || '').trim().slice(0,16) || 'Hráč';
    if(!S.selectedColor){ toast('Vyber si barvu'); return; }
    await refreshAll();
    if(S.players.length >= MAX_PLAYERS){ updateLobbyDynamic(); toast('Hra je plná'); return; }
    if(S.players.some(p=>p.color===S.selectedColor)){ updateLobbyDynamic(); toast('Barva už je obsazená'); return; }

    const id = 'p_' + Math.random().toString(36).slice(2,10);
    const player = {id, nickname, color: S.selectedColor, score: 0};
    const ok = await dbSet(kPlayer(S.room, id), player);
    if(!ok){ toast('Nepodařilo se připojit — zkontroluj adresu databáze a připojení'); return; }
    const newIds = [...S.ids, id];
    await dbSet(kIds(S.room), newIds);
    lsSet('bc_room', S.room);
    lsSet('bc_myId', id);
    S.myId = id;
    await refreshAll();
    S.screen = 'game';
    renderGame();
  }

  /* ================= GAME ================= */
  function myPlayer(){ return S.players.find(p=>p.id===S.myId); }

  function renderGame(){
    S.pending = '';
    S.sign = '+';
    prevAheadSet = null;
    seenTauntIds = new Set();
    const me = myPlayer();
    const myColor = me ? colorHex(me.color) : '#FFB800';

    app.innerHTML = `
      <div class="topbar">
        <div class="logo"><span class="dice"><span></span></span><b>BOARD</b><em>COUNT</em></div>
        <div class="topbar-right">
          <div class="room-badge" id="roomBadge" title="Klepni pro zkopírování odkazu na pozvánku"><span class="lbl">KÓD</span>${escapeHtml(S.room)}</div>
          <button class="icon-btn" id="gearBtn" aria-label="Nastavení">⚙</button>
        </div>
      </div>
      <div class="header-row" id="headerRow"></div>
      <div class="stage">
        <div class="my-score-wrap" id="myScoreWrap" style="--pc:${myColor}">
          <div class="my-label">Tvoje skóre</div>
          <div class="my-score" id="myScore">0</div>
          <div class="edit-hint">klepnutím upravíš ručně</div>
        </div>
        <div class="pending-wrap">
          <div class="pending-value" id="pendingValue">+0</div>
          <div class="fuse-track" id="fuseTrack"><div class="fuse-fill" id="fuseFill" style="--pc:${myColor}"></div></div>
        </div>
        <div class="keypad" id="keypad">
          <button class="key" data-d="7">7</button>
          <button class="key" data-d="8">8</button>
          <button class="key" data-d="9">9</button>
          <button class="key" data-d="4">4</button>
          <button class="key" data-d="5">5</button>
          <button class="key" data-d="6">6</button>
          <button class="key" data-d="1">1</button>
          <button class="key" data-d="2">2</button>
          <button class="key" data-d="3">3</button>
          <button class="key func sign" id="signKey">±</button>
          <button class="key" data-d="0">0</button>
          <button class="key func" id="backKey">⌫</button>
        </div>
      </div>
      ${optionsModalHtml()}
    `;

    updateGameDynamic();
    document.getElementById('keypad').querySelectorAll('[data-d]').forEach(btn=>{
      btn.addEventListener('click', ()=>pressDigit(btn.dataset.d));
    });
    document.getElementById('signKey').addEventListener('click', toggleSign);
    document.getElementById('backKey').addEventListener('click', pressBackspace);
    document.getElementById('gearBtn').addEventListener('click', openOptions);
    document.getElementById('myScore').addEventListener('click', startScoreEdit);
    document.getElementById('roomBadge').addEventListener('click', copyInviteLink);

    wireOptionsModal();
  }

  function copyInviteLink(){
    const url = location.origin + location.pathname + '?room=' + S.room;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        ()=>toast('Odkaz zkopírován — pošli ho spoluhráčům'),
        ()=>toast('Kód hry: ' + S.room)
      );
    } else {
      toast('Kód hry: ' + S.room);
    }
  }

  function updateGameDynamic(){
    const headerRow = document.getElementById('headerRow');
    if(!headerRow) return;
    const prevScores = {};
    headerRow.querySelectorAll('.player-square').forEach(el=>{ prevScores[el.dataset.id] = el.dataset.score; });

    headerRow.innerHTML = S.players.map(p=>`
      <div class="player-square ${p.id===S.myId?'me':''}" data-id="${p.id}" data-score="${p.score}" style="--pc:${colorHex(p.color)}">
        ${p.id===S.myId?'<span class="youtag">TY</span>':''}
        <div class="prow"><span class="dot"></span><span class="name">${escapeHtml(p.nickname)}</span></div>
        <div class="score">${p.score}</div>
      </div>
    `).join('');

    headerRow.querySelectorAll('.player-square').forEach(el=>{
      const id = el.dataset.id;
      if(prevScores[id] !== undefined && prevScores[id] !== el.dataset.score){
        const scoreEl = el.querySelector('.score');
        scoreEl.classList.add('bump');
        setTimeout(()=>scoreEl.classList.remove('bump'), 300);
      }
    });

    const me = myPlayer();
    const myScoreEl = document.getElementById('myScore');
    if(me && myScoreEl && !S.editingScore && myScoreEl.textContent !== String(me.score)){
      myScoreEl.textContent = me.score;
      myScoreEl.classList.add('bump');
      setTimeout(()=>myScoreEl.classList.remove('bump'), 260);
    }
    updateOptionsPlayerList();
    checkOvertakes();
  }

  function renderPending(){
    const pv = document.getElementById('pendingValue');
    const ft = document.getElementById('fuseTrack');
    if(!pv) return;
    if(S.pending){
      pv.textContent = (S.sign==='-'?'−':'+') + S.pending;
      pv.classList.add('show');
      ft.classList.add('show');
    } else {
      pv.classList.remove('show');
      ft.classList.remove('show');
    }
  }

  function pressDigit(d){
    if(S.pending === '0') S.pending = '';
    if(S.pending.length >= 4) return;
    S.pending += d;
    renderPending();
    restartTimer();
  }
  function pressBackspace(){
    S.pending = S.pending.slice(0, -1);
    renderPending();
    if(S.pending) restartTimer(); else cancelTimer();
  }
  function toggleSign(){
    S.sign = S.sign === '+' ? '-' : '+';
    renderPending();
    if(S.pending) restartTimer();
  }

  function restartTimer(){
    cancelTimer();
    const dur = S.settings.delayMs || 2000;
    const fill = document.getElementById('fuseFill');
    if(fill){
      fill.classList.remove('run');
      void fill.offsetWidth;
      fill.style.animationDuration = dur + 'ms';
      fill.classList.add('run');
    }
    timerHandle = setTimeout(commitPending, dur);
  }
  function cancelTimer(){
    if(timerHandle){ clearTimeout(timerHandle); timerHandle = null; }
    const fill = document.getElementById('fuseFill');
    if(fill){ fill.classList.remove('run'); }
  }

  async function commitPending(){
    timerHandle = null;
    if(!S.pending) return;
    const delta = (S.sign==='-'? -1:1) * parseInt(S.pending, 10);
    S.pending = '';
    S.sign = '+';
    renderPending();
    const fill = document.getElementById('fuseFill');
    if(fill) fill.classList.remove('run');

    const me = myPlayer();
    if(!me) return;
    const updated = {...me, score: me.score + delta};
    const idx = S.players.findIndex(p=>p.id===me.id);
    if(idx >= 0) S.players[idx] = updated;
    updateGameDynamic();

    writingScore = true;
    try{
      const ok = await dbSet(kPlayer(S.room, updated.id), updated);
      if(!ok) toast('Nepodařilo se uložit skóre, zkontroluj připojení');
    } finally {
      writingScore = false;
    }
  }

  function startScoreEdit(){
    if(S.editingScore) return;
    const me = myPlayer();
    if(!me) return;
    cancelTimer();
    S.pending = ''; S.sign = '+'; renderPending();
    S.editingScore = true;
    const wrap = document.getElementById('myScoreWrap');
    const scoreEl = document.getElementById('myScore');
    scoreEl.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'number';
    input.value = me.score;
    input.className = 'nick-input';
    input.style.textAlign = 'center';
    input.style.fontFamily = 'var(--font-mono)';
    input.style.fontSize = 'clamp(30px,10vw,44px)';
    input.style.fontWeight = '700';
    input.style.marginBottom = '0';
    input.style.color = 'var(--pc)';
    wrap.insertBefore(input, wrap.querySelector('.edit-hint'));
    input.focus();
    input.select();
    async function finish(save){
      S.editingScore = false;
      if(save){
        const val = parseInt(input.value, 10);
        if(!isNaN(val)){
          const me2 = myPlayer();
          if(me2){
            const updated2 = {...me2, score: val};
            const idx2 = S.players.findIndex(p=>p.id===me2.id);
            if(idx2 >= 0) S.players[idx2] = updated2;
            writingScore = true;
            try{ await dbSet(kPlayer(S.room, updated2.id), updated2); }
            finally { writingScore = false; }
          }
        }
      }
      input.remove();
      scoreEl.style.display = '';
      updateGameDynamic();
    }
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter') finish(true);
      if(e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', ()=>finish(true));
  }

  /* ================= Options modal ================= */
  function optionsModalHtml(){
    return `
      <div class="overlay" id="optOverlay">
        <div class="modal">
          <h3>Nastavení <span class="x" id="optClose">✕</span></h3>
          <div class="opt-block">
            <div class="opt-label">Zpoždění před přičtením</div>
            <div class="delay-row">
              <input type="range" id="delayRange" min="500" max="5000" step="250" value="${S.settings.delayMs}">
              <span class="delay-val" id="delayVal">${(S.settings.delayMs/1000).toFixed(2)}s</span>
            </div>
          </div>
          <div class="opt-block">
            <div class="opt-label">Hráči ve hře ${escapeHtml(S.room)}</div>
            <div class="opt-players" id="optPlayers"></div>
          </div>
          <div class="opt-block">
            <button class="opt-btn" id="newGameBtn">↺ Nová hra (vynulovat skóre)</button>
            <button class="opt-btn danger" id="wipeBtn">🗑 Smazat celou hru</button>
            <button class="opt-btn danger" id="leaveBtn">🚪 Opustit hru</button>
          </div>
        </div>
      </div>
    `;
  }

  function openOptions(){
    document.getElementById('optOverlay').classList.add('open');
    updateOptionsPlayerList();
  }
  function closeOptions(){
    const el = document.getElementById('optOverlay');
    if(el) el.classList.remove('open');
  }
  function updateOptionsPlayerList(){
    const el = document.getElementById('optPlayers');
    if(!el) return;
    el.innerHTML = S.players.map(p=>`
      <div class="opt-player-row">
        <span class="dot" style="background:${colorHex(p.color)}"></span>
        <span class="nm">${escapeHtml(p.nickname)}${p.id===S.myId?' (ty)':''}</span>
        <span class="sc">${p.score}</span>
      </div>
    `).join('');
  }

  function showConfirm(message, danger, onYes){
    const div = document.createElement('div');
    div.className = 'overlay open';
    div.style.zIndex = '70';
    div.innerHTML = `
      <div class="modal" style="max-width:360px;">
        <h3 style="margin-bottom:16px;">${escapeHtml(message)}</h3>
        <button class="opt-btn ${danger?'danger':''}" id="confirmYes">Potvrdit</button>
        <button class="opt-btn" id="confirmNo">Zrušit</button>
      </div>
    `;
    document.body.appendChild(div);
    div.querySelector('#confirmYes').addEventListener('click', ()=>{ div.remove(); onYes(); });
    div.querySelector('#confirmNo').addEventListener('click', ()=>{ div.remove(); });
    div.addEventListener('click', e=>{ if(e.target === div) div.remove(); });
  }

  function wireOptionsModal(){
    const overlay = document.getElementById('optOverlay');
    document.getElementById('optClose').addEventListener('click', closeOptions);
    overlay.addEventListener('click', e=>{ if(e.target === overlay) closeOptions(); });

    const range = document.getElementById('delayRange');
    const val = document.getElementById('delayVal');
    range.addEventListener('input', ()=>{ val.textContent = (range.value/1000).toFixed(2) + 's'; });
    range.addEventListener('change', async ()=>{
      const ms = parseInt(range.value, 10);
      S.settings = {...S.settings, delayMs: ms};
      await dbSet(kSettings(S.room), S.settings);
      toast('Zpoždění nastaveno na ' + (ms/1000).toFixed(2) + 's');
    });

    document.getElementById('newGameBtn').addEventListener('click', ()=>{
      showConfirm('Vynulovat skóre všech hráčů?', false, async ()=>{
        await refreshAll();
        for(const p of S.players){ await dbSet(kPlayer(S.room, p.id), {...p, score:0}); }
        await refreshAll();
        prevAheadSet = null;
        updateGameDynamic();
        toast('Nová hra — skóre vynulováno');
        closeOptions();
      });
    });

    document.getElementById('wipeBtn').addEventListener('click', ()=>{
      showConfirm('Opravdu smazat celou hru a všechny hráče v místnosti ' + S.room + '?', true, async ()=>{
        await refreshAll();
        for(const id of S.ids){ await dbDel(kPlayer(S.room, id)); }
        await dbSet(kIds(S.room), []);
        lsDel('bc_myId');
        S.myId = null;
        closeOptions();
        await refreshAll();
        S.screen = 'lobby';
        renderLobby();
      });
    });

    document.getElementById('leaveBtn').addEventListener('click', ()=>{
      showConfirm('Opustit hru na tomto zařízení?', true, async ()=>{
        await refreshAll();
        const newIds = S.ids.filter(id=>id!==S.myId);
        if(S.myId) await dbDel(kPlayer(S.room, S.myId));
        await dbSet(kIds(S.room), newIds);
        lsDel('bc_myId');
        S.myId = null;
        closeOptions();
        await refreshAll();
        S.screen = 'lobby';
        renderLobby();
      });
    });
  }

  init();
})();
</script>
</body>
</html>
